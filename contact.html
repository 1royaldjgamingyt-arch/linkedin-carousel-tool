<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - CarouselCraft</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vercel Web Analytics -->
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
  <div class="max-w-3xl mx-auto px-4 py-12">
    <a href="/" class="text-blue-600 text-sm font-semibold hover:underline">← Back to Tool</a>

    <div class="space-y-6 text-sm leading-relaxed text-gray-700">

        <p class="mb-4">You can reach out directly via email:</p>
        <a href="mailto:support@linkedincarouseltool.in" class="text-blue-600 font-medium hover:underline text-base">support@linkedincarouseltool.in</a>

      <p class="text-xs text-gray-500">We typically respond to all inquiries within 24 to 48 business hours.</p>
    </div>
  </div>
